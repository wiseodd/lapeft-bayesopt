name: build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import lapeft_bayesopt.surrogates.lora, lapeft_bayesopt.utils.acqf"
